scene_01:

  # --------------------------------------------------------
  # Basic Information
  # --------------------------------------------------------
  scene_id: 1

  scene_name: Campus Walkway

  environment:
    indoor_outdoor: Outdoor
    scene_type: Campus Walkway
    description: >
      A static CCTV camera recording a campus walkway where many people
      pass throughout the day. Two green belts containing trees separate
      multiple pedestrian walkways.

  # --------------------------------------------------------
  # Camera Information
  # --------------------------------------------------------
  camera:
    type: Moving
    angle: High
    field_of_view: Broad

  # --------------------------------------------------------
  # Reference Sequences
  # --------------------------------------------------------
  reference_sequences:
    - "01_002"
    - "01_068"
    - "01_163"

  # --------------------------------------------------------
  # Physical Objects
  # --------------------------------------------------------
  common_objects:
    - People
    - Backpacks
    - Trees
    - Grass
    - Crosswalk
    - Street Light
    - Trash Bin
    - Sign Board
    - Bicycle
    - Mop

  # --------------------------------------------------------
  # Normal Activities
  # --------------------------------------------------------
  normal_activities:
    - Walking
    - Standing
    - Sitting
    - Waiting
    - Running
    - Cycling
    - Using Phone
    - Carrying Luggage
    - Sweeping
    - Maintenance Work

  # --------------------------------------------------------
  # Contextual Concerns
  # --------------------------------------------------------
  contextual_concerns:
    - Fighting
    - Falling
    - Loitering
    - Screaming
    - Weapons
    - Blocking Pathway
    - Attacking
    - Damaging Trees
    - Vehicle Intrusion
    - Suspicious Object

  # --------------------------------------------------------
  # Environmental Constraints
  # --------------------------------------------------------
  environmental_constraints:
    - Hazy Weather
    - Tilted Camera

  # --------------------------------------------------------
  # Scene Purpose
  # --------------------------------------------------------
  scene_purpose:
    - Pedestrian Movement
    - Walking
    - Cycling



